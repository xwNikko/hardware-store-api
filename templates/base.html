<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3 mb-4">
    <span class="navbar-brand mb-0">Ferretería · Sistema de inventario</span>
    {% if user %}
    <div class="text-white small">
        {{ user.nombre }} ({{ user.rol }}) &middot;
        <a class="text-white" href="/logout">Cerrar sesión</a>
    </div>
    {% endif %}
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
